{% extends "base.html" %}

{% block content %}

<h2>Add Timeline</h2>

<form method="POST">

    <label>Title</label><br>
    <input type="text" name="title" required><br><br>

    <label>Description</label><br>
    <textarea name="description"></textarea><br><br>

    <label>Background Image</label><br>
    <select name="timeline_image" id="timeline_image_select">
        <option value="">(None)</option>
        {% for img in images %}
            <option value="{{ img.id }}">{{ img.filename }}</option>
        {% endfor %}
    </select><br><br>

    <img id="image_preview" src=""
         style="max-width:300px; max-height:140px; object-fit:contain; border-radius:4px; margin-bottom:12px; display:none;">

    <script>
    document.getElementById("timeline_image_select").addEventListener("change", function() {
        const id = this.value;
        const preview = document.getElementById("image_preview");
        if (id) {
            preview.src = "/image/" + id;
            preview.style.display = "block";
        } else {
            preview.style.display = "none";
        }
    });
    </script>

    <br>
    <button type="submit">Create Timeline</button>

</form>

{% endblock %}
